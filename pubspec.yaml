name: chapterflow
description: ChapterFlow — site-aware novel reader with owned Prev/TOC/Next chrome and continuous English translation.
publish_to: 'none'
version: 0.2.1

environment:
  # withValues(), CardThemeData/TabBarThemeData normalization, and other
  # APIs used here landed in Flutter 3.27 / Dart 3.6. Build with Flutter
  # 3.27+ (any current stable release, e.g. 3.4x, satisfies this).
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_inappwebview: ^6.1.5
  dio: ^5.4.0
  flutter_secure_storage: ^10.0.0
  # hive/hive_flutter (hivedb.dev) are unmaintained and their pubspec sdk
  # upper-bound predates Dart 3, so `flutter pub get` fails to resolve them
  # against any current Flutter SDK. hive_ce / hive_ce_flutter is the
  # actively maintained, API-compatible fork (same classes, only the
  # import path changes) — see services/storage_service.dart and
  # models/chapter.dart.
  hive_ce: ^2.0.0
  hive_ce_flutter: ^2.0.0
  shared_preferences: ^2.2.2
  path_provider: ^2.1.2

dependency_overrides:
  flutter_inappwebview:
    git:
      url: https://github.com/pichillilorenzo/flutter_inappwebview.git
      path: flutter_inappwebview
      ref: 17527cae5a3371c1e87f9c1df4281a7710debf28

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

# Launcher icons are generated from the source assets below rather than
# being committed per-density by hand, so `mipmap-*` never drifts out of
# sync. Regenerate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#171A24"
  # A launcher may mask away the outer third of the foreground layer, so
  # this is a wider crop in which the artwork sits inside the safe zone.
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
